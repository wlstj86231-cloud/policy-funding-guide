<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없습니다 | 정책자금 백과</title>
  <meta name="description" content="요청한 정책자금 백과 페이지가 없거나 주소가 변경되었습니다. 홈에서 최신 정책정보를 다시 찾아보세요.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root{--ink:#0f172a;--ink2:#334155;--ink3:#64748b;--ink4:#94a3b8;--sur:#f8f7f5;--white:#fff;--line:rgba(15,23,42,.09);--blue:#1a56db;--blue-bg:#eff5ff;--r:8px;--r2:14px;--f:'A2z','Noto Sans KR',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    @font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-4Regular.woff2') format('woff2');font-weight:400;font-display:swap}@font-face{font-family:'A2z';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2601-6@1.0/에이투지체-7Bold.woff2') format('woff2');font-weight:700;font-display:swap}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--sur);color:var(--ink);font-family:var(--f);line-height:1.75;word-break:keep-all;display:flex;flex-direction:column}a{color:inherit}header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}.h-top{height:60px;max-width:980px;margin:0 auto;padding:0 24px;display:flex;align-items:center}.logo{text-decoration:none;display:flex;flex-direction:column;line-height:1.05}.logo-main{font-size:20px;font-weight:800}.logo-main span{color:var(--blue)}.logo-sub{font-size:10px;color:var(--ink4);text-transform:uppercase}
    main{width:100%;max-width:760px;margin:auto;padding:48px 24px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:44px;text-align:center}.code{font-size:12px;font-weight:800;color:var(--blue);letter-spacing:1px;margin-bottom:12px}.icon{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--blue-bg);color:var(--blue);font-size:30px;font-weight:800}h1{font-size:clamp(25px,5vw,34px);line-height:1.35;margin:0 0 12px}p{color:var(--ink3);margin:0 auto 24px;max-width:510px}.actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}.actions a{text-decoration:none;border-radius:var(--r);padding:11px 15px;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff}.actions a.primary{background:var(--blue);border-color:var(--blue);color:#fff}
    footer{background:#fff;border-top:1px solid var(--line);padding:26px 24px}.foot{max-width:980px;margin:0 auto}.foot-links{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:12px}.foot-links a{font-size:12px;color:var(--ink3)}.foot-note{font-size:12px;color:var(--ink3)}
    @media(max-width:600px){main{padding:28px 16px}.card{padding:30px 20px}.h-top{padding:0 16px}}
  </style>
</head>
<body>
  <header><div class="h-top"><a class="logo" href="/"><span class="logo-main">정책자금 <span>백과</span></span><span class="logo-sub">Government Fund Guide</span></a></div></header>
  <main>
    <section class="card">
      <div class="icon" aria-hidden="true">?</div><div class="code">ERROR 404</div>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 잘못 입력되었거나 문서가 최신 정보로 통합·이동되었을 수 있습니다. 홈에서 사업명이나 기관명을 다시 검색해 주세요.</p>
      <div class="actions"><a class="primary" href="/">홈에서 다시 찾기</a><a href="/corrections/">정정 정책 보기</a></div>
    </section>
  </main>
  <footer><div class="foot"><div class="foot-links"><a href="/about/">사이트 소개</a><a href="/editorial-policy/">편집 원칙</a><a href="/privacy/">개인정보처리방침</a><a href="/terms/">이용약관</a><a href="/corrections/">정정 정책</a><a href="/contact/">문의 안내</a></div><div class="foot-note">정책자금 백과는 정부기관이 아니며 신청 대행이나 승인 보장을 제공하지 않습니다.</div></div></footer>
</body>
</html>
